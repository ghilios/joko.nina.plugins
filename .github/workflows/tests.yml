name: Tests

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  test:
    name: Run unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore test project
        run: dotnet restore Joko.NINA.Plugins/Joko.NINA.Plugins.HocusFocus.Tests/Joko.NINA.Plugins.HocusFocus.Tests.csproj

      - name: Run tests
        run: >
          dotnet test Joko.NINA.Plugins/Joko.NINA.Plugins.HocusFocus.Tests/Joko.NINA.Plugins.HocusFocus.Tests.csproj
          -c Debug
          --no-restore
          -p:PostBuildEvent=
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"
          --settings Joko.NINA.Plugins/Joko.NINA.Plugins.HocusFocus.Tests/coverlet.runsettings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml

      - name: Generate coverage summary
        if: always() && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        shell: pwsh
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator `
            -reports:TestResults/**/coverage.cobertura.xml `
            -targetdir:CoverageReport `
            -reporttypes:"MarkdownSummaryGithub;HtmlSummary"
          if (Test-Path CoverageReport/SummaryGithub.md) {
            Get-Content CoverageReport/SummaryGithub.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload HTML coverage summary
        if: always() && hashFiles('CoverageReport/summary.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: CoverageReport/
