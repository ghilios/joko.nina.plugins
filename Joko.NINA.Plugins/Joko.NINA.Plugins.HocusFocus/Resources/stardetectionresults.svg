<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 200 200"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!--
    Star Detection Results icon.
    A 5-pointed star (representing a detected star) above a 3-bar chart
    (representing the statistical results).  EvenOdd fill on the star
    produces the classic hollow-center silhouette.
  -->
  <!-- 5-pointed star, center (100,56), outer r=40, inner r=16 -->
  <path
     d="M 100,20 L 109.4,47.1 L 138,47.6 L 115.2,64.9 L 123.5,92.4
        L 100,76 L 76.5,92.4 L 84.8,64.9 L 62,47.6 L 90.6,47.1 Z"
     fill-rule="evenodd"
     fill="#808080" />
  <!-- Bar 1: left, short -->
  <rect x="32"  y="148" width="30" height="30" fill="#808080" />
  <!-- Bar 2: center, tallest -->
  <rect x="85"  y="128" width="30" height="50" fill="#808080" />
  <!-- Bar 3: right, medium -->
  <rect x="138" y="138" width="30" height="40" fill="#808080" />
  <!-- Baseline -->
  <rect x="25"  y="178" width="150" height="5" fill="#808080" />
</svg>
